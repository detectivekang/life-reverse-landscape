   load:'加载中...',refresh:'刷新',offline:'离线 - 无法使用排名/兑换',run_ok:'排名 +{0}分  /  可兑换 +{1}金币',run_no:'不计入（需登录游玩）',run_err:'无法验证本局',run_wait:'正在确认结果...',
   cloud:'已读取云存档',cloudUp:'云存档已更新',confirmGo:'前往中...'}};
 const tt=(k,...a)=>{const d=X[I18N.cur]||X.en;let s=d[k]!=null?d[k]:X.en[k]!=null?X.en[k]:k;a.forEach((v,i)=>{s=s.replace('{'+i+'}',v);});return s;};
 const nf=n=>Math.floor(Number(n)||0).toLocaleString();
 let db=null,user=null,loaded=false,info=null,rank=null,busy=false,runId=null,lastRun=null,tab=0,exAmt=100,msg='',msgAt=0,syncT=null,infoAt=0,rankAt=0;
 function note(s){msg=s;msgAt=performance.now();}

 const origSave=Meta.save;Meta.save=function(m){m.ts=Date.now();origSave(m);queueSync();};
 // ---------- 로그인: 인생역전과 같은 사이트라서 Supabase 세션(localStorage)을 그대로 공유한다 ----------

 // ---------- 클라우드 세이브 ----------
 async function cloudLoad(){try{const r=await db.from('nh_saves').select('data').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;loaded=true;
   const c=r.data&&r.data.data;if(!c){if(((meta.stats&&meta.stats.runs)||0)>0)push();return;}
   const lr=(meta.stats&&meta.stats.runs)||0,cr=(c.stats&&c.stats.runs)||0;
   if(cr>lr||(cr===lr&&(c.ts||0)>(meta.ts||0))){if(mode==='play'){loaded=false;return;}Object.assign(meta,Meta.def(),c);origSave(meta);note(tt('cloud'));}
   else if(lr>cr||(meta.ts||0)>(c.ts||0))push();}catch(e){loaded=false;}}
 async function push(){if(!db||!user||!loaded)return;try{const r=await db.from('nh_saves').upsert({user_id:user.id,data:meta},{onConflict:'user_id'});if(r.error)throw r.error;}catch(e){}}

 addEventListener('pagehide',()=>{clearTimeout(syncT);push();});
 // ---------- 판 시작/종료: 서버가 판을 검증해서 골드(환전용)와 시즌 점수를 인정한다 ----------
 function runStart(stage){runId=null;lastRun=null;if(!db||!user)return;db.rpc('nh_start_run',{p_stage:stage}).then(r=>{if(!r.error)runId=r.data;});}
 async function runEnd(win){const s=st,rid=runId;runId=null;
  if(!db||!user||!rid){lastRun={s:user?'no':'guest'};return;}
  lastRun={s:'wait'};
  try{const r=await db.rpc('nh_finish_run',{p_run:rid,p_time:s.t,p_kills:s.kills|0,p_win:!!win,p_asc:s.asc|0,p_bosskills:s.bk|0,p_coins:s.coins|0,p_gold:s.gold|0,p_name:nameOf()});
   if(r.error)throw r.error;const d=r.data||{};lastRun={s:'ok',g:d.credited_gold||0,p:d.score_added||0};infoAt=rankAt=0;refreshInfo(true);}
  catch(e){lastRun={s:'err'};}

 // ---------- 서버 조회 ----------

  try{const r=await db.rpc('nh_wallet_info');if(!r.error&&r.data&&r.data.ok)info=r.data;}catch(e){}}

 async function doExchange(){if(busy||!db||!user)return;const mx=maxEx();if(exAmt<1||exAmt>mx){note(tt(info&&info.day_left<=0?'e_limit':'e_not'));return;}
  busy=true;try{const r=await db.rpc('nh_exchange',{p_gold:exAmt});if(r.error)throw r.error;const d=r.data;
   meta.gold=Math.max(0,meta.gold-d.gold);Meta.save(meta);clearTimeout(syncT);push();note(tt('exOk',nf(d.shards)));snd(900,.15,'triangle',.08);
   info=Object.assign({},info,{exchangeable:d.exchangeable,day_left:d.day_left});exAmt=Math.min(exAmt,Math.max(1,maxEx()));infoAt=0;refreshInfo(true);}
  catch(e){const m=(e&&e.message)||'';note(tt(/NH_DAILY_LIMIT/.test(m)?'e_limit':/NH_NOT_ENOUGH/.test(m)?'e_not':'e_gen'));}
  busy=false;}
 function maxEx(){if(!info)return 0;return Math.max(0,Math.min(meta.gold|0,info.exchangeable|0,info.day_left|0));}
 async function goLR(){if(busy)return;busy=true;note(tt('confirmGo'));clearTimeout(syncT);try{await Promise.race([push(),new Promise(r=>setTimeout(r,2500))]);}catch(e){}location.href=LR_URL;}
 function signIn(){if(!db){note(tt('offline'));return;}db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});}
 // ---------- 화면 ----------
 function openHub(){mode='hub';tab=0;infoAt=rankAt=0;refreshInfo(true);refreshRank(true);}
 function menuBtn(){const w=124,x=W/2-w/2;GP.rr(g,x,2,w,18,9);g.fillStyle='rgba(56,225,255,.16)';g.fill();g.strokeStyle='rgba(56,225,255,.7)';g.lineWidth=1;g.stroke();
  txt('\u{1F6F8} '+tt('menu'),W/2,15,11,'#7ff0ff',null,w-8);btn(x,0,w,22,openHub);}
 function chip(x,y,w,h,label,sel,fn,col){GP.panel(g,x,y,w,h,col||'#38e1ff',sel);txt(label,x+w/2,y+h/2+5,13,sel?'#fff':'#9bb0e0',null,w-6);btn(x,y,w,h,fn);}
 function acctBox(x,y,w,compact){GP.panel(g,x,y,w,40,'#445588',false);
  if(user){txt((compact?'':tt('acct')+': ')+nameOf(),x+10,y+(compact?25:17),13,'#fff','left',w-20);if(!compact)txt(tt('same'),x+10,y+33,10,'#8fa6e0','left',w-20);}
  else if(!db){txt(tt('offline'),x+10,y+25,12,'#ff9a6a','left',w-20);}
  else{const bw=Math.min(w-16,170);GP.rr(g,x+w-bw-8,y+6,bw,28,14);g.fillStyle='rgba(56,225,255,.2)';g.fill();txt(tt('login'),x+w-bw/2-8,y+25,12,'#7ff0ff',null,bw-10);btn(x+w-bw-8,y+6,bw,28,signIn);
   if(!compact)txt(tt('guest'),x+10,y+25,13,'#ff9a6a','left',w-bw-24);}}
 function goBox(x,y,w){GP.rr(g,x,y,w,40,14);const gr=g.createLinearGradient(0,y,0,y+40);gr.addColorStop(0,'#ffd86b');gr.addColorStop(1,'#c98a1a');g.fillStyle=gr;g.fill();
  txt('\u{1F3E0} '+tt('go'),x+w/2,y+26,15,'#2a1a00',null,w-16);btn(x,y,w,40,goLR);}
 function drawHub(){btns=[];const w=Math.min(W-24,420),x=(W-w)/2,compact=H<520;
  GP.ntxt(g,'\u{1F310} '+tt('hub'),W/2,38,26,'#38e1ff');txt(tt('back'),16,24,14,'#8fb0ff','left',null,90);btn(0,4,100,36,()=>{mode='menu';});
  let y=52;

  else{acctBox(x,y,w,false);y+=48;goBox(x,y,w);y+=48;}
  const tw=(w-8)/2;chip(x,y,tw,30,tt('tabEx'),tab===0,()=>{tab=0;});chip(x+tw+8,y,tw,30,tt('tabRk'),tab===1,()=>{tab=1;refreshRank(false);},'#ffd23b');
  y+=40;
  if(tab===0){
   txt(T('gold',meta.gold),W/2,y+20,22,'#ffd23b',null,w);
   if(!user){txt(tt('nologin'),W/2,y+52,13,'#ff9a6a',null,w);}
   else if(!info){txt(tt('load'),W/2,y+52,13,'#8fb0ff',null,w);}
   else{

    chip(x+3*(cw+8),cy_,cw,32,tt('max')+' '+nf(mx),false,()=>{exAmt=Math.max(1,mx);},'#ffd23b');
    const by=cy_+42,ok=exAmt>=1&&exAmt<=mx&&!busy;GP.rr(g,x,by,w,44,14);g.fillStyle=ok?'rgba(39,232,176,.9)':'rgba(255,255,255,.08)';g.fill();
    txt(tt('doEx')+'  '+nf(exAmt)+' \u2192 \u{1F48E} '+nf(exAmt),x+w/2,by+29,16,ok?'#04211c':'#778',null,w-20);btn(x,by,w,44,doExchange);}
  }else{
   if(!user){txt(tt('nologin'),W/2,y+30,13,'#ff9a6a',null,w);}

   else{
    txt(tt('season',rank.season),x+4,y+14,12,'#ffd23b','left');txt(tt('refresh'),x+w-4,y+14,12,'#8fb0ff','right',90);btn(x+w-90,y,90,20,()=>refreshRank(true));
    const rh=24,n=Math.max(3,Math.min(rank.list.length,Math.floor((H-y-70)/rh)));

    rank.list.slice(0,n).forEach((p,i)=>{const yy=y+24+i*rh,me=user&&p.uid===user.id;if(me){g.fillStyle='rgba(56,225,255,.14)';GP.rr(g,x,yy,w,rh-2,6);g.fill();}
     txt('#'+p.rank,x+8,yy+16,12,p.rank<=3?'#ffd23b':'#8fb0ff','left');txt(String(p.name||''),x+48,yy+16,13,me?'#fff':'#cfe0ff','left',w*.5);txt(tt('pts',nf(p.score)),x+w-8,yy+16,13,'#7dffdc','right',w*.3);});

   }
  }
  if(msg&&performance.now()-msgAt<4000)txt(msg,W/2,H-14,12,'#fff',null,W-20);
